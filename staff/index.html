<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Sak Fitness — Staff Scanner</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

background:#080a0f;

color:white;

font-family:Arial,Helvetica,sans-serif;

}

header{

padding:18px 6%;

border-bottom:1px solid #29313d;

display:flex;

justify-content:space-between;

align-items:center;

}

.logo{

font-weight:900;

font-size:22px;

}

.logo span{

background:#a3ff12;

color:#071000;

padding:9px 12px;

border-radius:10px;

margin-right:8px;

}

main{

max-width:900px;

margin:auto;

padding:30px 16px;

}

h1{

font-size:clamp(40px,8vw,70px);

line-height:.95;

}

.green{

color:#a3ff12;

}

.card{

background:#11151d;

border:1px solid #29313d;

border-radius:20px;

padding:20px;

margin-top:20px;

}

.camera{

position:relative;

background:#000;

border-radius:15px;

overflow:hidden;

aspect-ratio:1;

}

video{

width:100%;

height:100%;

object-fit:cover;

}

.scanBox{

position:absolute;

width:65%;

height:65%;

left:17.5%;

top:17.5%;

border:3px solid #a3ff12;

border-radius:20px;

box-shadow:0 0 0 999px #0008;

}

button{

border:0;

border-radius:12px;

padding:13px 18px;

font-weight:bold;

cursor:pointer;

}

.primary{

background:#a3ff12;

color:#071000;

}

.secondary{

background:#181e28;

color:white;

border:1px solid #29313d;

}

input{

width:100%;

padding:14px;

background:#080b10;

border:1px solid #29313d;

border-radius:12px;

color:white;

font-size:16px;

margin:8px 0;

}

.status{

padding:14px;

border-radius:10px;

font-weight:bold;

margin-top:15px;

}

.active{

background:#a3ff1218;

color:#a3ff12;

}

.expired{

background:#ff557018;

color:#ff5570;

}

.row{

display:flex;

justify-content:space-between;

padding:12px;

background:#0b0f15;

border-radius:10px;

margin:7px 0;

}

.muted{

color:#9ba4b4;

}

.hidden{

display:none;

}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

}

@media(max-width:700px){

.grid{

grid-template-columns:1fr;

}

}

</style>

</head>


<body>

<header>

<div class="logo">

<span>S</span>Sak Fitness

</div>

<div>STAFF</div>

</header>


<main>

<h1>

Scan.<br>

<span class="green">Verify.</span>

</h1>

<p class="muted">

Scan a member's QR code to check their membership.

</p>


<div class="grid">


<div class="card">

<h2>QR Scanner</h2>

<div class="camera">

<video
id="video"
playsinline
muted>
</video>

<div class="scanBox"></div>

</div>

<br>

<button
class="primary"
onclick="startScanner()">

Start Camera

</button>

<button
class="secondary"
onclick="stopScanner()">

Stop

</button>

<p id="cameraMessage" class="muted"></p>

</div>


<div class="card">

<h2>Manual Verification</h2>

<p class="muted">

If camera scanning doesn't work, enter the Member ID.

</p>

<input
id="manualCode"
placeholder="SAK-123456">

<button
class="primary"
style="width:100%"
onclick="verifyManual()">

Verify Member

</button>

<div id="result"></div>

</div>


</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../config.js"></script>
<script src="../supabase.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>


<script>

const video =
document.getElementById("video");

let stream = null;

let scanning = false;


function verifyManual(){

    const code =
    document.getElementById(
        "manualCode"
    ).value.trim();

    if(code){

        verifyMember(code);

    }

}


async function verifyMember(code){

    code =
    code.trim().toUpperCase();


    if(!window.sakDb){

        showError(
            "Database not configured."
        );

        return;

    }


    const {data,error} =
    await window.sakDb
    .from("members")
    .select("*")
    .eq("member_code",code)
    .maybeSingle();


    if(error){

        showError(error.message);

        return;

    }


    if(!data){

        showError(
            "MEMBER NOT FOUND"
        );

        return;

    }


    const active =
    new Date(
        data.expiry_date+"T23:59:59"
    ) >= new Date();


    let html = "";

    html +=

    '<div class="status ' +
    (active ? "active" : "expired") +
    '">' +

    (active
    ? "✓ MEMBERSHIP ACTIVE"
    : "✕ MEMBERSHIP EXPIRED") +

    "</div>";


    html +=

    '<div class="row">' +
    "<span>Name</span>" +
    "<b>"+escapeHTML(data.name)+"</b>" +
    "</div>";


    html +=

    '<div class="row">' +
    "<span>Member ID</span>" +
    "<b>"+escapeHTML(data.member_code)+"</b>" +
    "</div>";


    html +=

    '<div class="row">' +
    "<span>Plan</span>" +
    "<b>"+escapeHTML(data.plan)+"</b>" +
    "</div>";


    html +=

    '<div class="row">' +
    "<span>Expires</span>" +
    "<b>"+formatDate(data.expiry_date)+"</b>" +
    "</div>";


    if(active){

        html +=

        '<br><button class="primary" ' +
        'onclick="checkIn(\'' +
        data.id +
        '\')">' +

        "✓ Confirm Check-In" +

        "</button>";

    }


    document.getElementById(
        "result"
    ).innerHTML = html;

}


async function checkIn(memberId){

    const {error} =
    await window.sakDb
    .from("checkins")
    .insert({

        member_id:memberId

    });


    if(error){

        alert(error.message);

    }else{

        alert(
            "Check-in recorded ✓"
        );

    }

}


function showError(message){

    document.getElementById(
        "result"
    ).innerHTML =

    '<div class="status expired">' +
    "✕ " +
    escapeHTML(message) +
    "</div>";

}


function escapeHTML(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(date){

    return new Date(
        date+"T00:00:00"
    ).toLocaleDateString(
        "en-IN",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


async function startScanner(){

    if(!window.sakDb){

        document.getElementById(
            "cameraMessage"
        ).textContent =
        "Database not configured.";

        return;

    }


    try{

        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                }
            },

            audio:false

        });


        video.srcObject =
        stream;

        await video.play();

        scanning = true;

        document.getElementById(
            "cameraMessage"
        ).textContent =
        "Point the camera at a member QR.";

        scanFrame();

    }

    catch(error){

        document.getElementById(
            "cameraMessage"
        ).textContent =
        "Camera permission was denied or unavailable.";

    }

}


function stopScanner(){

    scanning = false;

    if(stream){

        stream
        .getTracks()
        .forEach(track =>
            track.stop()
        );

    }

    stream = null;

    video.srcObject = null;

}


function scanFrame(){

    if(!scanning) return;


    if(video.readyState >= 2){

        const canvas =
        document.createElement(
            "canvas"
        );

        canvas.width =
        video.videoWidth;

        canvas.height =
        video.videoHeight;


        const ctx =
        canvas.getContext("2d");

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const code =
        window.jsQR
        ? jsQR(
            image.data,
            image.width,
            image.height
        )
        : null;


        if(code && code.data){

            verifyMember(
                code.data
            );

            if(navigator.vibrate){

                navigator.vibrate(150);

            }

            scanning = false;

        }

    }


    requestAnimationFrame(
        scanFrame
    );

}

</script>

</body>
</html>
